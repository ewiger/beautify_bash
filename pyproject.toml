[project]
name = "beautify-bash"
version = "2.0.0"
description = "Code formatter / beautifier for bash and zsh shell scripts."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Lutus" },
]
maintainers = [
    { name = "Yauhen Yakimovich", email = "yauhen.yakimovich.mail@gmail.com" },
]
keywords = ["bash", "zsh", "shell", "formatter", "beautifier", "indent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ewiger/beautify_bash"
Repository = "https://github.com/ewiger/beautify_bash"
Issues = "https://github.com/ewiger/beautify_bash/issues"

[project.scripts]
beautify-bash = "beautify_bash.cli:app"
beautify_bash = "beautify_bash.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beautify_bash"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["beautify_bash"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Typer resolves annotations at runtime via `get_type_hints`, so they must stay
# evaluable on the oldest supported interpreter (3.9) even with
# `from __future__ import annotations`. That rules out PEP 604 unions.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults.
"src/beautify_bash/cli.py" = ["B008"]

[tool.mypy]
# mypy no longer supports targeting 3.9; the test matrix covers it instead.
python_version = "3.10"
files = ["src"]
strict = true
